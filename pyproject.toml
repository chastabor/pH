# **The root builds nothing, and is not a distribution.** There is no `src/`
# here and nothing to compile, and unlike the arrangement this replaced there is
# no longer an empty wheel pretending otherwise: `phern` — the thing a person
# installs and the command they get — is `packages/phern`, a real package with
# real modules, and it carries the dependency list that used to live up here.
#
# What that deleted is worth naming, because it was all workaround: a
# `[build-system]` for a wheel with no code, `bypass-selection` to tell
# hatchling the emptiness was deliberate, an sdist `only-include` to stop it
# shipping the whole repository around 2 KB of metadata, a second copy of
# `[project.scripts]` because `uv tool install` links only the executables of
# the package it was *asked* for — and a test holding the two copies together,
# because nothing else would have noticed them drifting.
#
# uv calls what is left a *virtual* workspace root: members, tooling
# configuration, the dev group, and no `[project]` table at all.
# **torch from the CPU wheel index.** `ph-text-index[local]` depends on
# `sentence-transformers`, which depends on `torch`, whose default wheels bundle
# CUDA: measured here as 2.6 GB of `nvidia-*` plus 398 MB of `triton` beside a
# 770 MB torch, in a 4.2 GB environment. The embedding model runs on the CPU —
# `SentenceTransformer` picks a device at load and this deployment has no GPU
# path — so every one of those bytes is downloaded, stored and never executed.
#
# `explicit = true` so *only* the packages named in `[tool.uv.sources]` come from
# here: an index that served everything would silently shadow PyPI for any name
# it happened to carry, which is a supply-chain surface nobody asked for.
#
# A deployment that does want GPU embedding deletes these two blocks; nothing
# else references them, and `ph-text-index` is unchanged either way.
#
# **This governs the checkout and the lockfile, and nothing a PyPI user gets.**
# `[tool.uv.index]` and `[tool.uv.sources]` are uv's configuration, not PEP 621
# metadata, so neither survives into a published wheel. It reaches a consumer
# only if they ask for `[local]`, and when they do, `pip` takes the CUDA wheels
# from PyPI — so the line worth documenting for them is
#
#   pip install "phern[local]" --extra-index-url https://download.pytorch.org/whl/cpu
#
# Expressing that *in the metadata* would need an environment marker no index
# selection can carry. Leaving it to the installer is the same decision the
# extra itself makes, one layer down.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ph-core = { workspace = true }
phern = { workspace = true }
ph-rlm = { workspace = true }
ph-runtime-guest = { workspace = true }
ph-stabilize = { workspace = true }
ph-text-index = { workspace = true }
ph-code-graph = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "anyio>=4.4,<5",
    "types-PyYAML>=6.0",
    "types-croniter>=3.0",
    "pytest-textual-snapshot>=1.0",
    # Not a runtime dependency of any member: `ph.locks` is the only shipped
    # module that may import it and a gate enforces that. Two suites reach
    # for it directly to stand in for another process, and declaring it here
    # is what keeps that honest — arriving only through `ph-core` would
    # break them the day `ph.locks` moves to bare `fcntl.flock`.
    "filelock>=3.15",
    # The extras themselves, not their contents: pinning the distributions here
    # too would let CI green on a version the package does not allow.
    "ph-core[otel]",
    "phern[web]",
    "ph-text-index[local]",
]

# ---------------------------------------------------------------- tooling ----

[tool.ruff]
line-length = 100
target-version = "py312"
# `plans/` and `sources/` are reference material, not this project's code:
# ruff formats fenced Python inside Markdown, and reformatting a quoted excerpt
# would silently edit the record it is quoting.
extend-exclude = ["plans", "sources", ".venv"]
src = [
    "packages/ph-core/src",
    "packages/phern/src",
    "packages/ph-rlm/src",
    "packages/ph-runtime-guest/src",
    "packages/ph-stabilize/src",
    "packages/ph-text-index/src",
    "packages/ph-code-graph/src",
]

[tool.ruff.lint]
# ANN401 only, not all of ANN: mypy's strict mode already requires the
# annotations the rest of the group asks for. The `Any` parameters that predate
# the rule carry `# noqa: ANN401`, which RUF100 deletes as each one is retired.
#
# PLC0415, an import inside a function, for shipped code (N3). One runs only when its
# function does, so a misspelled name or an import cycle waits for the process that
# calls it in that order. Each that stays says why in a comment above it and carries
# `# noqa: PLC0415`: optional, heavy and platform modules, and the CLI's late loads.
# RUF100 deletes a noqa that stops suppressing anything. `tests/test_import_cycles.py`
# is what makes moving one to the top safe.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN401", "PLC0415"]
# B008: Typer expresses CLI options as call-valued defaults.
# UP040: PEP 695 `type` aliases are lazily evaluated, and pydantic resolves the
#   discriminated-union aliases in this codebase at class-definition time.
ignore = ["B008", "UP040"]

[tool.ruff.lint.per-file-ignores]
"!packages/*/src/**" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
# Every shipped package, not just `ph`: `ph_rlm` and `ph_runtime` are where the
# subprocess protocol lives, and a config that checked only `ph` would have let
# the guest drift untyped.
#
# **The test trees are here too, and that took removing a duplicate rather than
# a flag** (issue 32). They were excluded because two of them held a module
# named `conftest` and mypy refuses duplicates — its own suggestion, an
# `__init__.py` in each tree, does not help: with `explicit_package_bases` the
# module name would have to be `packages.ph-rlm.tests.conftest`, and `ph-rlm`
# is not an identifier, so both collapse to `tests.conftest` again (checked).
# (`packages/phern` would survive that test; `packages/ph-rlm` is the one that
# proves the rule, and a rule that held for only some members is not one.)
# The fix was to stop having two: the per-package fixture modules are now
# `app_fixtures` and `rlm_fixtures`, registered from the one root `conftest.py`
# through `pytest_plugins`. That also retired a latent bug the trees had
# documented in five places — `from conftest import ROW` resolved to whichever
# conftest won the name under full collection.
#
# `mypy_path` carries the test directories for the same reason `pythonpath`
# does below: `daemon_helpers`, `tui_helpers`, `rlm_fixtures` and friends are
# top-level modules that tests import by name, and both tools have to find them
# in the same place.
mypy_path = "packages/ph-core/src:packages/phern/src:packages/ph-rlm/src:packages/ph-runtime-guest/src:packages/ph-stabilize/src:packages/ph-text-index/src:packages/ph-code-graph/src:packages/phern/tests:packages/ph-rlm/tests:packages/ph-stabilize/tests:packages/ph-core/tests:tests"
# One list, because mypy takes `packages` or `files` and not both. The `src`
# entries are the seven shipped packages, reached by path so `mypy_path` above
# supplies the base that makes their module names come out as `ph`, `ph_app`
# and so on rather than as the directories they sit in.
files = [
    "packages/ph-core/src/ph",
    "packages/phern/src/ph_app",
    "packages/ph-rlm/src/ph_rlm",
    "packages/ph-runtime-guest/src/ph_runtime",
    "packages/ph-stabilize/src/ph_stabilize",
    "packages/ph-text-index/src/ph_text_index",
    "packages/ph-code-graph/src/ph_code_graph",
    "conftest.py",
    "packages/ph-core/tests",
    "packages/phern/tests",
    "packages/ph-rlm/tests",
    "packages/ph-stabilize/tests",
    "packages/ph-text-index/tests",
    "packages/ph-code-graph/tests",
    "packages/ph-runtime-guest/tests",
    "tests",
]
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
# Where the shared test-support modules live. `daemon_helpers`, `tui_helpers`,
# `app_fixtures`, `rlm_fixtures`, `runtime_helpers`, `stabilize_helpers` and
# `fixture_replay` are top-level modules a test imports by name. Under pytest's
# default `prepend` mode they were found only because collecting a directory
# inserts it into `sys.path` — which made the import order-dependent, and is why
# `from conftest import ROW` once resolved to a *different* package's conftest.
# Declared here they are on the path from startup, which is also what lets the
# one root `conftest.py` register two of them as plugins.
pythonpath = [
    "tests",
    "packages/phern/tests",
    "packages/ph-rlm/tests",
    "packages/ph-stabilize/tests",
    "packages/ph-core/tests",
]

testpaths = [
    "packages/ph-core/tests",
    "packages/phern/tests",
    "packages/ph-rlm/tests",
    "packages/ph-stabilize/tests",
    "packages/ph-text-index/tests",
    "packages/ph-code-graph/tests",
    "packages/ph-runtime-guest/tests",
    "tests",
]
addopts = "-ra"
markers = [
    "e2e: end-to-end scenario tests",
    # The two tiers that drive a real binary rather than a stub. Declared here
    # and skipped in `conftest.pytest_collection_modifyitems`, so the decision
    # "is git installed" is made once for the whole suite instead of by a
    # `skipif` constant that the third module to need it forgot to import — and
    # so `ph.testing.git`/`ph.testing.jj`, which ship inside `ph-core`, hold no
    # pytest import at all.
    "needs_git: drives a real git binary",
    "needs_jj: drives a real jj binary",
]

[tool.coverage.run]
source = ["ph"]
branch = true

[tool.coverage.report]
# **A ratchet, not the target.** P6-02 asks for a 100 % gate on `ph-core`, and a
# gate set at 100 would have been red on every push from the day it landed —
# this repo's CI file already argues that case about Windows ("a signal that is
# always red stops being read, which costs more than it buys"), and the same
# reasoning applies to a coverage number. So the gate enforces the floor that is
# actually true today, which is the enforceable half: coverage cannot *fall*.
#
# Raising it is the work P6-02 owes, and each increment is a one-line commit
# here plus the tests that earned it:
#
#   91 — 91.21 %, 9 987 statements, 656 uncovered, 44 of 120 files at 100 %
#   93 — 93.51 %, 11 142 statements, 539 uncovered, 51 files at 100 %
#   91 — back down; 93 was never reachable by CI (below)
#
# **A percentage is a property of a host, not of a checkout**, and that is what
# the 93 step got wrong. Three tiers of this suite skip when their binary is
# absent, and a skip removes covered lines while leaving the statements in the
# denominator. Measured here one PATH at a time, on a single commit:
#
#   no jj, no bwrap, no agentfs    91.21 %   (exactly the 91 row above)
#   + jj                           91.98 %
#   + bwrap                        92.54 %
#   + agentfs                      93.36 %   ← a developer workstation
#
# 93 was taken on a workstation with all three. CI had none of them and could
# never reproduce it, which is why the gate was red on every push rather than
# measuring anything. `jj`, `bubblewrap` and `socat` are installed in the
# workflow now, but `agentfs` is not published anywhere a runner can fetch, so
# the overlay tier's ~12 tests skip there permanently and the ~0.8 points they
# carry are out of reach of any gate CI runs.
#
# **91 rather than 92, deliberately, and the margin is the point.** 92.54 % is
# what a runner holds when `bwrap` can actually unshare — and Ubuntu restricts
# unprivileged user namespaces, so that is a property of the runner image rather
# than of this repository. A floor at 92 bets the whole gate on a sysctl: if the
# image stops permitting it, coverage drops to 91.98 % and every push goes red
# for a reason nobody caused. 91 holds either way, and holds on the macOS leg
# too, which has `sandbox-exec` but no `agentfs` and which nothing here has
# measured.
#
# That is the same argument the top of this comment makes about a gate set at
# 100: the number has to be one CI can hold on its worst good day, or it stops
# being read. Raising it means making `agentfs` fetchable, or earning the points
# somewhere that does not depend on what the host has installed — not
# re-measuring on a laptop.
#
# The second step came from the four modules the row named as worst
# (`tools/json_schema.py` 45.5 → 99, `resources.py` 38.8 → 92, `paths.py` 68.2 →
# 92, `tools/sdk.py` 60.6 → 100) plus `cordis/plugin.py`. Two of those had no
# test module at all, which is what the percentage was really measuring: the
# raw-dict JSON-Schema validator that gates every MCP-declared tool, and the
# TypeScript SDK renderer a Code Mode model reads as its entire tool surface.
#
# The number is a floor and not a ceiling: it is set to the whole percent below
# what is measured, so an unrelated refactor that shifts a few branches does not
# turn a green push red for a reason nobody caused.
fail_under = 91
show_missing = true
skip_covered = true
