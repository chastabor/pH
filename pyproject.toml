[project]
name = "ph-workspace"
version = "0.0.0"
description = "pH — a Python agent harness ported from DeepSeek Harness (workspace root)."
requires-python = ">=3.12"
dependencies = [
    "ph-core",
    "ph-app",
    "ph-rlm",
    "ph-runtime-guest",
    "ph-stabilize",
    "ph-text-index",
    "ph-code-graph",
]

[tool.uv]
package = false

# **torch from the CPU wheel index.** `ph-text-index` depends on
# `sentence-transformers`, which depends on `torch`, whose default wheels bundle
# CUDA: measured here as 2.6 GB of `nvidia-*` plus 398 MB of `triton` beside a
# 770 MB torch, in a 4.2 GB environment. The embedding model runs on the CPU —
# `SentenceTransformer` picks a device at load and this deployment has no GPU
# path — so every one of those bytes is downloaded, stored and never executed.
#
# `explicit = true` so *only* the packages named in `[tool.uv.sources]` come from
# here: an index that served everything would silently shadow PyPI for any name
# it happened to carry, which is a supply-chain surface nobody asked for.
#
# A deployment that does want GPU embedding deletes these two blocks; nothing
# else references them, and `ph-text-index` is unchanged either way.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ph-core = { workspace = true }
ph-app = { workspace = true }
ph-rlm = { workspace = true }
ph-runtime-guest = { workspace = true }
ph-stabilize = { workspace = true }
ph-text-index = { workspace = true }
ph-code-graph = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "anyio>=4.4",
    "types-PyYAML>=6.0",
    "types-croniter>=3.0",
    "pytest-textual-snapshot>=1.0",
    # The extras themselves, not their contents: pinning the distributions here
    # too would let CI green on a version the package does not allow.
    "ph-core[otel]",
    "ph-app[web]",
]

# ---------------------------------------------------------------- tooling ----

[tool.ruff]
line-length = 100
target-version = "py312"
# `plans/` and `sources/` are reference material, not this project's code:
# ruff formats fenced Python inside Markdown, and reformatting a quoted excerpt
# would silently edit the record it is quoting.
extend-exclude = ["plans", "sources", ".venv"]
src = [
    "packages/ph-core/src",
    "packages/ph-app/src",
    "packages/ph-rlm/src",
    "packages/ph-runtime-guest/src",
    "packages/ph-stabilize/src",
    "packages/ph-text-index/src",
    "packages/ph-code-graph/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008: Typer expresses CLI options as call-valued defaults.
# UP040: PEP 695 `type` aliases are lazily evaluated, and pydantic resolves the
#   discriminated-union aliases in this codebase at class-definition time.
ignore = ["B008", "UP040"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
# Every shipped package, not just `ph`: `ph_rlm` and `ph_runtime` are where the
# subprocess protocol lives, and a config that checked only `ph` would have let
# the guest drift untyped. `packages` rather than `.` because the test trees hold
# several modules named `conftest`, which mypy refuses as duplicates.
mypy_path = "packages/ph-core/src:packages/ph-app/src:packages/ph-rlm/src:packages/ph-runtime-guest/src:packages/ph-stabilize/src:packages/ph-text-index/src:packages/ph-code-graph/src"
packages = ["ph", "ph_app", "ph_rlm", "ph_runtime", "ph_stabilize", "ph_text_index", "ph_code_graph"]
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = [
    "packages/ph-core/tests",
    "packages/ph-app/tests",
    "packages/ph-rlm/tests",
    "packages/ph-stabilize/tests",
    "packages/ph-text-index/tests",
    "packages/ph-code-graph/tests",
    "tests",
]
addopts = "-ra"
markers = [
    "e2e: end-to-end scenario tests",
]

[tool.coverage.run]
source = ["ph"]
branch = true

[tool.coverage.report]
# **A ratchet, not the target.** P6-02 asks for a 100 % gate on `ph-core`, and a
# gate set at 100 would have been red on every push from the day it landed —
# this repo's CI file already argues that case about Windows ("a signal that is
# always red stops being read, which costs more than it buys"), and the same
# reasoning applies to a coverage number. So the gate enforces the floor that is
# actually true today, which is the enforceable half: coverage cannot *fall*.
#
# Raising it is the work P6-02 owes, and each increment is a one-line commit
# here plus the tests that earned it:
#
#   91 — 91.21 %, 9 987 statements, 656 uncovered, 44 of 120 files at 100 %
#   93 — 93.51 %, 11 142 statements, 539 uncovered, 51 files at 100 %
#
# The second step came from the four modules the row named as worst
# (`tools/json_schema.py` 45.5 → 99, `resources.py` 38.8 → 92, `paths.py` 68.2 →
# 92, `tools/sdk.py` 60.6 → 100) plus `cordis/plugin.py`. Two of those had no
# test module at all, which is what the percentage was really measuring: the
# raw-dict JSON-Schema validator that gates every MCP-declared tool, and the
# TypeScript SDK renderer a Code Mode model reads as its entire tool surface.
#
# The number is a floor and not a ceiling: it is set to the whole percent below
# what is measured, so an unrelated refactor that shifts a few branches does not
# turn a green push red for a reason nobody caused.
fail_under = 93
show_missing = true
skip_covered = true
