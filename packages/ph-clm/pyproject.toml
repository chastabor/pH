[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ph-clm"
version = "0.8.0"
description = "pH plugin: the model edits its own context — tombstone, replace and rewrite sections of the surface, with the originals kept in the log."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Charles Tabor" }]
keywords = ["agent", "llm", "context-management", "clm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Nothing but the core: every edit is a surface `replace` ph-core already folds,
# so a log written with this package opens and derives the same context on an
# install without it.
dependencies = ["ph-core==0.8.0"]

[project.urls]
Homepage = "https://github.com/chastabor/pH"
Repository = "https://github.com/chastabor/pH"
Documentation = "https://github.com/chastabor/pH/blob/main/docs/README.md"
Issues = "https://github.com/chastabor/pH/issues"

[project.entry-points."ph.bundles"]
clm = "ph_clm:BUNDLE"

[project.entry-points."ph.plugins"]
clm-context = "ph_clm.tools:apply"

[tool.uv.sources]
ph-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ph_clm"]
