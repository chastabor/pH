# ph-clm: the model edits its own context, over any profile.
#
# The bundle has two rows: the section map with its tools, and the context file.
# Every edit is a surface `replace`, so compaction continues to work beside it.
# Compaction summarizes the surface, including the revisions. It stays the
# backstop when a session still outgrows its window.

- id: clm-context
  name: clm-context

# The context as a file that the model edits with its ordinary tools. The file is
# read back after each call, and its edits land through the same editor that the
# tools use (`CLM`).
- id: clm-mirror
  name: clm-mirror
