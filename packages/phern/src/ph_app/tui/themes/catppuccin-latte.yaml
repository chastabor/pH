# catppuccin-latte — the Catppuccin Latte palette, mapped onto pH's roles.
#
# `vars` is the palette as its authors publish it, whole: a role is re-pointed by
# naming a different color below, and the four flavours differ only in this
# block. Roles are pH's closed set (`TuiTheme`), so a role missing here is a
# refusal at load rather than a color that silently defaults.
#
# Palette: https://github.com/catppuccin/catppuccin

dark: false

vars:
  rosewater: "#dc8a78"
  flamingo:  "#dd7878"
  pink:      "#ea76cb"
  mauve:     "#8839ef"
  red:       "#d20f39"
  maroon:    "#e64553"
  peach:     "#fe640b"
  yellow:    "#df8e1d"
  green:     "#40a02b"
  teal:      "#179299"
  sky:       "#04a5e5"
  sapphire:  "#209fb5"
  blue:      "#1e66f5"
  lavender:  "#7287fd"
  text:      "#4c4f69"
  subtext1:  "#5c5f77"
  subtext0:  "#6c6f85"
  overlay2:  "#7c7f93"
  overlay1:  "#8c8fa1"
  overlay0:  "#9ca0b0"
  surface2:  "#acb0be"
  surface1:  "#bcc0cc"
  surface0:  "#ccd0da"
  base:      "#eff1f5"
  mantle:    "#e6e9ef"
  crust:     "#dce0e8"

# The roles pH draws with, each naming a color from the palette above.
background:           base
foreground:           text
surface:              mantle
panel:                surface0
muted:                overlay1
border:               surface1
accent:               mauve
success:              green
error:                red
warning:              peach
user_text:            blue
assistant_text:       text
thinking_text:        overlay1
tool_success:         green
tool_error:           red
highlight_background: surface2
highlight_text:       text
