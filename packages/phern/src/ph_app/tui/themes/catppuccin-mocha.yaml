# catppuccin-mocha: the Catppuccin Mocha palette, mapped onto the roles of pH.
#
# `vars` is the whole palette as its authors publish it. To point a role at a
# different color, name that color below. The four flavors differ only in the
# `vars` block and in `dark`, which is `false` for Latte alone. The roles are
# the closed set of pH (`TuiTheme`), so a role that is missing here is refused
# at load and does not silently take a default color.
#
# Palette: https://github.com/catppuccin/catppuccin

dark: true

vars:
  rosewater: "#f5e0dc"
  flamingo:  "#f2cdcd"
  pink:      "#f5c2e7"
  mauve:     "#cba6f7"
  red:       "#f38ba8"
  maroon:    "#eba0ac"
  peach:     "#fab387"
  yellow:    "#f9e2af"
  green:     "#a6e3a1"
  teal:      "#94e2d5"
  sky:       "#89dceb"
  sapphire:  "#74c7ec"
  blue:      "#89b4fa"
  lavender:  "#b4befe"
  text:      "#cdd6f4"
  subtext1:  "#bac2de"
  subtext0:  "#a6adc8"
  overlay2:  "#9399b2"
  overlay1:  "#7f849c"
  overlay0:  "#6c7086"
  surface2:  "#585b70"
  surface1:  "#45475a"
  surface0:  "#313244"
  base:      "#1e1e2e"
  mantle:    "#181825"
  crust:     "#11111b"

# The roles pH draws with, each naming a color from the palette above.
background:           base
foreground:           text
surface:              mantle
panel:                surface0
muted:                overlay1
border:               surface1
accent:               mauve
success:              green
error:                red
warning:              peach
user_text:            blue
assistant_text:       text
thinking_text:        overlay1
tool_success:         green
tool_error:           red
highlight_background: surface2
highlight_text:       text
