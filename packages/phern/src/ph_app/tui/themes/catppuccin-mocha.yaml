# catppuccin-mocha — the Catppuccin Mocha palette, mapped onto pH's roles.
#
# `vars` is the palette as its authors publish it, whole: a role is re-pointed by
# naming a different color below, and the four flavours differ only in this
# block. Roles are pH's closed set (`TuiTheme`), so a role missing here is a
# refusal at load rather than a color that silently defaults.
#
# Palette: https://github.com/catppuccin/catppuccin

dark: true

vars:
  rosewater: "#f5e0dc"
  flamingo:  "#f2cdcd"
  pink:      "#f5c2e7"
  mauve:     "#cba6f7"
  red:       "#f38ba8"
  maroon:    "#eba0ac"
  peach:     "#fab387"
  yellow:    "#f9e2af"
  green:     "#a6e3a1"
  teal:      "#94e2d5"
  sky:       "#89dceb"
  sapphire:  "#74c7ec"
  blue:      "#89b4fa"
  lavender:  "#b4befe"
  text:      "#cdd6f4"
  subtext1:  "#bac2de"
  subtext0:  "#a6adc8"
  overlay2:  "#9399b2"
  overlay1:  "#7f849c"
  overlay0:  "#6c7086"
  surface2:  "#585b70"
  surface1:  "#45475a"
  surface0:  "#313244"
  base:      "#1e1e2e"
  mantle:    "#181825"
  crust:     "#11111b"

# The roles pH draws with, each naming a color from the palette above.
background:           base
foreground:           text
surface:              mantle
panel:                surface0
muted:                overlay1
border:               surface1
accent:               mauve
success:              green
error:                red
warning:              peach
user_text:            blue
assistant_text:       text
thinking_text:        overlay1
tool_success:         green
tool_error:           red
highlight_background: surface2
highlight_text:       text
