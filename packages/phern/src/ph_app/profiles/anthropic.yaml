# A profile for the messages API of Anthropic.
- insert:
    - id: llm-anthropic
      name: llm-anthropic
      config:
        provider: anthropic
        apiKeyEnv: ANTHROPIC_API_KEY
        contextWindow: 200000
        defaultMaxTokens: 8192

# The models that this profile runs on, by key. The key is `main` unless the
# user picks another (`--model fast`, `/model fast`). An overlay of the user
# replaces the whole list.
- id: models
  config:
    default: main
    models:
      main: {provider: anthropic, model: claude-sonnet-5}
      deep: {provider: anthropic, model: claude-opus-5-5}
      fast: {provider: anthropic, model: claude-haiku-4-5-20251001}
