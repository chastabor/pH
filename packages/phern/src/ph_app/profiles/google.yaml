# A profile for the Gemini API of Google.
#
# This is the one shipped route that declares video, and the gate of P7-03 needs
# a provider for that. Here `uploads` defaults to the video family and not to
# nothing, because the Files API of this provider is the documented path for a
# video, and a 300 MB clip cannot go inline under a request cap of 20 MB.
#
# `apiKeyEnv` is a *name* and never an interpolation. The adapter resolves it at
# the request edge, so the value never enters a row, an event, or a child
# process (I-3).
- insert:
    - id: llm-google
      name: llm-google
      config:
        provider: google
        baseUrl: ${env:GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
        apiKeyEnv: GEMINI_API_KEY
        contextWindow: 1048576

# The models that this profile runs on, by key. The key is `main` unless the
# user picks another. `GEMINI_MODEL` names another model without an overlay.
- id: models
  config:
    default: main
    models:
      main: {provider: google, model: "${env:GEMINI_MODEL:-gemini-2.5-pro}"}
      fast: {provider: google, model: gemini-2.5-flash}
