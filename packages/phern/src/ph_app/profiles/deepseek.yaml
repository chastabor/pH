# A profile for DeepSeek over the OpenAI-compatible wire.
#
# `${env:...}` is the only interpolation that the loader performs, and the API
# key is never interpolated here. The adapter takes the *name* of an environment
# variable and resolves it at the request edge, so the value never enters a row,
# an event, or a child process (I-3).
- insert:
    - id: llm-deepseek
      name: llm-openai-compatible
      config:
        profiles:
          - provider: deepseek
            baseUrl: ${env:DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
            apiKeyEnv: DEEPSEEK_API_KEY
            contextWindow: 128000
            defaultMaxTokens: 8192

# The models that this profile runs on, by key. The key is `main` unless the
# user picks another.
- id: models
  config:
    default: main
    models:
      main: {provider: deepseek, model: deepseek-chat}
      reasoner: {provider: deepseek, model: deepseek-reasoner}
