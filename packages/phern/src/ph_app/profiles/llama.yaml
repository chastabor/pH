# A profile for a local llama.cpp server over the OpenAI-compatible wire.
#
# This is the shipped route that is *not* a hosted service. That is the reason
# why it is its own document and not a `baseUrl` note on `deepseek.yaml`: three
# defaults of `ProviderProfile` are wrong for a server on localhost, and each
# one fails in a different direction (see below).
#
# `apiKeyEnv` is a *name* and never an interpolation, exactly as on every other
# route (I-3). Here the value is a formality and not a secret: llama.cpp ignores
# the `Authorization` header unless it was started with `--api-key`. The name is
# still resolved at the request edge, so `LLAMA_API_KEY` must be set to
# *something*, or the route refuses with `MISSING_CREDENTIAL`. Set it to `local`
# and forget it.
#
#   export LLAMA_API_KEY=local
#   phern --profile llama --provider llama --model "$(the model llama-server loaded)" -p "hi"
#
# **`contextWindow` is the window of one slot, not of the server.** llama.cpp
# divides `--ctx-size` by `--parallel`, so a server that was started with
# `-c 1572864 --parallel 6` gives each of its six slots 262144. That is the
# number that pH budgets and compacts against. If pH read the total of the
# server, each of six agents would believe that it has the whole KV cache.
#
# **So the window is asked for and not written down.** `contextWindowProbes`
# reads `default_generation_settings.n_ctx` from `/props` at mount. llama.cpp
# also reports that figure for each entry of `/slots`, which shows that the
# figure belongs to the slot. The line below is only the fallback for a server
# that answers none of the probes. It is deliberately small: a guess that is too
# high overflows a slot, and a guess that is too low only compacts sooner than
# necessary. `phern doctor` prints which of the two is in force.
#
# **This port is not only llama.cpp.** `LLAMA_BASE_URL` names a port, and the
# server that listens on it is llama.cpp one day and vLLM the next. So the
# probes are a list, tried in order of trust.
# `ProviderProfile.context_window_probes` gives that argument, and it is not
# repeated here.
- insert:
    - id: llm-llama
      name: llm-openai-compatible
      config:
        profiles:
          - provider: llama
            baseUrl: ${env:LLAMA_BASE_URL:-http://127.0.0.1:9931/v1}
            apiKeyEnv: LLAMA_API_KEY
            # **The window is asked of the server and not guessed.** The probes
            # are stated here and not selected by a flag. The adapter that this
            # row mounts also serves OpenAI, DeepSeek and every gateway in
            # between, so the endpoints, which belong to these two servers,
            # belong in this profile. Another server is another two lines here,
            # with no edit to `ph_app.adapters`.
            #
            # **`measures` decides, and the order does not.** llama.cpp answers
            # both of its endpoints, and they do not answer the same question.
            # `/props` reports the slot. `/v1/models` returns the header of the
            # GGUF itself: `meta.n_ctx` beside `n_ctx_train`, `n_vocab` and
            # `n_embd`. A server that runs below the ceiling of its model
            # reports that header unchanged. `WindowProbe.measures` gives the
            # argument and the measurement. Both endpoints were measured against
            # a real server. `-c` is the total of the server and llama.cpp
            # divides it, so `/props` is the only one of the two that moves when
            # `--parallel` does.
            contextWindowProbes:
              - path: /props
                field: [default_generation_settings, n_ctx]
              # vLLM: one entry for each model, with `max_model_len` on the entry
              # itself. That number *is* what a request may use: its
              # `--max-model-len`.
              - path: /v1/models
                field: [data, 0, max_model_len]
              # The same endpoint of llama.cpp. It is last, and it is marked for
              # what it is: a ceiling, which is useful only when `/props` is
              # unreachable.
              - path: /v1/models
                field: [data, 0, meta, n_ctx]
                measures: model
            contextWindow: ${env:LLAMA_CONTEXT_WINDOW:-32768}
            defaultMaxTokens: 4096
            # **Images, no audio, no uploads.** Only the audio differs from the
            # row default, which describes the endpoint of OpenAI. Each of the
            # three has a reason:
            #
            # * **Audio is dropped.** This row defaults to the image *and* audio
            #   families. llama.cpp needs an audio projector for `input_audio`,
            #   and most multimodal GGUFs have none. `/props` states the answer
            #   of its model, `"modalities":{"vision":true,"audio":false}`, and
            #   that is the line to read before this list is widened.
            # * **Images are kept**, although a server that was started without
            #   `--mmproj` will reject the request. The reverse default was
            #   tried first and is worse. A text-only deployment never attaches
            #   a picture, so it never meets this field. A deployment that *did*
            #   load a projector would have its photograph silently downgraded
            #   to a text pointer. The repair for that is a whole route restated
            #   in `$PH_HOME/profiles/llama.yaml`, because an overlay replaces a
            #   list and does not merge into it. An overlay that trims `accepts`
            #   and forgets to restate `baseUrl` inherits the default of this
            #   row, `api.openai.com`. That is a local deployment that quietly
            #   calls a hosted provider.
            #
            #   The downgrade is also *expensive*, and not only quiet. With
            #   `accepts: []` and a picture attached, the pointer told a
            #   27B-parameter agent that there was an image that it could not
            #   see. The agent spent eighteen steps trying to look: `attach`
            #   twice, `glob`, then `sips` to transcode the JPEG, and
            #   hand-written zlib to decode the PNG into ASCII art of the
            #   silhouette of the subject. It was still going when the run was
            #   killed. A pointer is a correct answer to "this route cannot take
            #   media". It is a *terrible* prompt for a tool-using agent, and
            #   that is the main reason why this field errs toward claiming
            #   images.
            #
            #   So the pointer path is the one that a deployment must opt *into*:
            #
            #       # $PH_HOME/profiles/llama.yaml — a server with no --mmproj
            #       - id: llm-llama
            #         config:
            #           profiles:
            #             - provider: llama
            #               baseUrl: ${env:LLAMA_BASE_URL:-http://127.0.0.1:9931/v1}
            #               apiKeyEnv: LLAMA_API_KEY
            #               accepts: []
            #
            # * **`uploads` stays at its empty default**, and it must. There is
            #   no `/files` endpoint here at all, so a MIME type that is listed
            #   there would be removed by an intersection and not referenced.
            #   See `_body`.
            accepts: ["image/png", "image/jpeg", "image/gif", "image/webp"]
            # llama.cpp takes these two beyond the sampling fields of OpenAI, so
            # the `topK` and `minP` of a route are sent and not dropped with a
            # warning.
            samplingExtras: [topK, minP]

# A local server serves whatever was loaded, so the model of the one route is
# `LLAMA_MODEL`, the variable that the live gate already reads. A server that
# ignores the name answers with its loaded model either way.
#
# **There are no `efforts`, because the loaded model is not known here.** They
# say what each reasoning effort sends to the model (`ModelRoute.efforts`).
# Without them, an effort that is asked for is not sent, with a warning. No
# effort, or `default`, sends none, and the default of the server applies. A
# Qwen3 model takes its thinking switch through the `chat_template_kwargs` of
# llama.cpp, so an overlay that serves one writes:
#
#       main:
#         provider: llama
#         model: "${env:LLAMA_MODEL:-default}"
#         efforts:
#           none: {chat_template_kwargs: {enable_thinking: false}}
#           high: {chat_template_kwargs: {enable_thinking: true}}
- id: models
  config:
    default: main
    models:
      main: {provider: llama, model: "${env:LLAMA_MODEL:-default}"}
