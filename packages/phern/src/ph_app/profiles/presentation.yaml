# The presentation rows of ph_app, layered into every named profile.
#
# Presentation rows shape only how a front end draws (`affects: presentation`).
# So no profile that a user writes may set them, and none of the named profiles
# says whether it has them. `tui-screens` and `tui-status` are the seams, and
# they ship in `ph-base`. This file holds the registrants that this package
# contributes.
#
# They are in every profile, headless included. The daemon that holds a headless
# run is also what a TUI attaches to, and a screen that nothing draws costs
# nothing. A user who does not want a screen hides it in `$PH_HOME/tui.json`.

# Each screen is its own row, so `/<id>`, its key and its palette entry share
# the lifetime of that row: the trajectory (`/trajectory`) and the diff
# (`/diff`).
- insert:
    - id: tui-screen-trajectory
      name: tui-screen-trajectory
    - id: tui-screen-diff
      name: tui-screen-diff
