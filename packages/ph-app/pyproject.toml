[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ph-app"
version = "0.0.1"
description = "pH CLI and TUI: print/json/transcript/rpc modes and the Textual front-end."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "ph-core",
    "filelock>=3.15",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    # Bounded at both ends, and both ends are load-bearing.
    #
    # The ceiling: `PHTuiApp.add_binding` writes into Textual's
    # `BindingsMap.key_to_bindings` through the private `app._bindings`, because
    # the public `bind()` drops the `id` that `apply_keymap` matches on — and
    # that id is what makes a contributed screen's key rebindable in `tui.json`
    # like every other (P4-17). A major release that renames it should be a
    # decision someone makes, not one a resolver makes for them; without a
    # ceiling the breakage lands as an `AttributeError` at plugin load, and only
    # for users who have a screen-registering row installed.
    #
    # The floor: what the suite actually passes on, measured rather than
    # guessed. `>=1.0` was untrue — `MarkdownStream` (the transcript's streaming
    # append) does not exist before 5 and `Widget.release_anchor` not before 4,
    # so `ph_app.tui.widgets.transcript` cannot even import there. The committed
    # SVG snapshots then narrow it further: 8.2.4 fails `test_the_full_app_shell`
    # and 8.2.5 is the first release every gate passes on.
    "textual>=8.2.5,<9",
]

[project.optional-dependencies]
# The browser front end (P7-05). An extra rather than a dependency: `ph -p` in a
# script, `ph daemon` under systemd and `ph --mode tui` all run without a web
# server, and `textual-serve` brings aiohttp and jinja2 with it. `--mode web`
# without the extra fails with the install line rather than an ImportError.
web = ["textual-serve>=1.1.3"]

[project.entry-points."ph.plugins"]
llm-openai-compatible = "ph_app.adapters.openai_compatible:apply"
llm-anthropic = "ph_app.adapters.anthropic:apply"
tui-screen-trajectory = "ph_app.tui.trajectory_screen:apply"

[project.scripts]
ph = "ph_app.cli:main"

[tool.uv.sources]
ph-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ph_app"]

# No force-include: `packages` already ships every file under `src/ph_app`,
# data files included, and naming the profiles again made the wheel build fail
# outright ("a second file is being added at the same path").
