[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ph-runtime-guest"
version = "0.12.0"
description = "The guest half of pH's code runtime: the fd-3 protocol, the run loop, and the binding proxies a cell awaits."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Charles Tabor" }]
keywords = ["agent", "code-mode", "runtime", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Deliberately almost dependency-free. This package is installed into
# `$PH_CACHE/runtime-venv`, a venv that executes code that a model wrote. Every
# dependency there is another import that such code can reach, and another thing
# that can break a session in a way that the host cannot repair. `dill` is the
# one exception. It is imported lazily, so a venv without it still runs cells,
# and snapshots only the values that the standard pickler accepts.
dependencies = ["dill>=0.3.8"]

[project.urls]
Homepage = "https://github.com/chastabor/pH"
Repository = "https://github.com/chastabor/pH"
Documentation = "https://github.com/chastabor/pH/blob/main/docs/README.md"
Issues = "https://github.com/chastabor/pH/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ph_runtime"]

# ---------------------------------------------------------------- coverage ----
# **The guest runs in a subprocess, so the collector of the parent records none
# of it.** Every cell is a fresh `python -m ph_runtime`. The report showed
# `runner.py` at 0 % while twenty-six kernel tests drove cells through it, and
# showed 26.1 % for this package against a true 84.1 %.
#
# `conftest.guest_coverage` points `COVERAGE_PROCESS_START` at this file for the
# tests that start guests. The `.pth` hook of `coverage` reads that variable at
# interpreter startup and starts a collector in the child. The variable survives
# `ph.seams.subprocess.scrub_env`, because the scrub is a denylist for
# credentials and not an allowlist. The scrub therefore needs no exception.
#
# **The settings are here and not in the workspace gate, on purpose.** The gate
# is `--cov=ph` against `fail_under = 93` in the root manifest, and it measures
# `ph-core` alone. Adding `ph_runtime` to that `source` would change the
# denominator that the ratchet was measured against. 683 statements at about
# 84 % beside 16 821 at about 93 % puts the total just under the floor. A
# package that is *measured* for the first time would then look like a package
# that had regressed. These are two questions, so there are two numbers.
[tool.coverage.run]
source = ["ph_runtime"]
branch = true

# One data file for each process, merged afterward. Every cell is a fresh
# interpreter. Without this setting the processes would overwrite each other,
# and the report would describe whichever guest exited last.
parallel = true

# **The path is absolute and comes from the environment, because the cwd of the
# guest is not the repo.** A kernel starts the guest in the workspace of the
# session, which is a `tmp_path` that pytest deletes. A relative `data_file`
# therefore writes the measurements into a directory that is gone before
# anything can combine them. That is one of the two reasons why this collection
# silently produced nothing for so long. The other reason is that nothing set
# `COVERAGE_PROCESS_START` at all.
data_file = "${PH_GUEST_COVERAGE_DATA}"

[tool.coverage.report]
# There is deliberately no `fail_under` yet. The subprocess baseline is 84.1 %,
# and this number does *not* include the in-process unit tests of this package,
# which neither report measures. A floor belongs here when it means "every way
# in which `ph_runtime` is exercised". The comment in the root manifest makes
# the argument about a number that is set from one measurement.
show_missing = true
