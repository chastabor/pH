# ph-rlm: Prime Agent's design as plugins, over ph-base.
#
# The `rlm` profile is base + tui + this. Every row here is a listener on a seam
# that already exists; the only core change the bundle needs is the one the
# `code_runtime` seam already carries — `namespace` and `persistence` (C1).

# --- Code Mode --------------------------------------------------------------
# Opt-in in `ph-base`, on here: the RLM model writes Python, so the transport
# and its bindings are the whole surface it sees. `tools.mode: code` is what
# makes a native tool call refuse with the SDK route back (C6).
- id: tools
  config:
    mode: code

- id: tools-code-mode
  name: tools-code-mode
  config:
    maxDispatchesPerRun: 256
    maxSubagentSpawnsPerRun: 32
    maxParallelSubCalls: 10

# The model-facing half of Code Mode: the transport is presented as `ipython`,
# with prime-agent's description verbatim and its result layout. `run_code` stays
# the reserved internal name — a profile renames the transport, it does not
# replace it (P3-09).
- id: rlm-presentation
  name: rlm-presentation

# --- the runtime ------------------------------------------------------------
# pH's own CPython subprocess, fd 3 as the framed channel, one child per agent.
# `persistence: namespace` is admissible only because the provider promises to
# emit `kernel/snapshot` events, and the seam checks that promise when it
# registers (D6) — cross-call state invisible to the log is exactly why dsh
# withheld a persistent kernel.
- id: code-runtime-python
  name: code-runtime-python
  config:
    # `managed` builds $PH_CACHE/runtime-venv: ph-runtime-guest, dill, and the
    # Python skills. Nothing else, because everything in it is reachable by
    # model code.
    python: managed
    cpuSeconds: 30
    addressSpaceBytes: 2147483648
    maxLogBytes: 65536
    maxValueBytes: 65536
    maxSnapshotBytes: 16777216

# --- delegation ------------------------------------------------------------
# `rlm()` as a `ctx.subagents` provider: admission is logged and the handle
# returns before the child answers, so a parent can fan out and keep working
# (P3-11). The roster the parent reads back is the fold over these events, not a
# side table, so it survives restart and compaction by construction.
# E4 note: a child gets `read` unless it asks for `write`, and that default is
# the seam's (`SubagentRequest.access`) rather than a row knob — until
# `ctx.workspace` lands (Phase 4, D21) a `write` request is recorded and
# downgraded with a reason code, because a guarantee nothing enforces must not
# be granted, and a row knob that could not change that would be a lie.
- id: rlm-subagent-provider
  name: rlm-subagent-provider
  config:
    maxDepth: 2

# The model-facing half: `rlm.run(...)` inside a cell is a governed dispatch,
# not a comm-channel RPC — so a policy row can deny or ask on spawning, and C4's
# spawn budget counts it (P3-10).
- id: rlm-bindings
  name: rlm-bindings

# Agent-to-agent messages (P3-12). The nuclear-family boundary is a *guard* —
# deny-only, last, and not re-permittable by any later listener (C7) — while the
# rate limit is backpressure the tool body raises, because ending a whole cell
# over four messages in a second is not what a rate limit means.
- id: rlm-messaging
  name: rlm-messaging
  config:
    maxMessageChars: 16384
    maxPending: 20
    rateCapacity: 3
    rateRefillSeconds: 1.0

# The doctrine (P3-14). Sections after `tools:sdk`, because they refer to the
# surface it has just described — and the volatile facts (depth, cwd, family,
# workspace tier) are a `context()` snapshot rather than a cached section, or
# every turn that changed one would re-bill the whole prefix (A12).
- id: rlm-prompt
  name: rlm-prompt

# The Continual Harness (P3-16, D14): state is a fold over `harness/refined`
# rather than a file, so a fork inherits the harness as of its boundary and a
# rollback is derivable from the event that made the change. `/refine` is a
# command, not a tool — it is something the human asks for.
- id: rlm-harness
  name: rlm-harness

# Capability-layer skills (P3-18): `SKILL.md` for the catalog, an installable
# package for the kernel. The knowledge layer (`/refine`) may point at these and
# may not create them — I7, and the reason the two share a word, not a mechanism.
# No `paths` means no skills, so the row costs nothing until a deployment
# configures one.
- id: rlm-skills-python
  name: rlm-skills-python

# "Prompt-as-a-variable" (P3-17, Q4): a corpus the model queries through
# `await tools.context_search(...)` — bindings, so each query is its own governed
# dispatch and one oversized result can be offloaded without its siblings.
# Disabled here and opt-in in `rlm-stable`: C3 gave the model governed
# `read`/`grep`/`glob`, which demoted this from a headline feature to a
# specialist one for non-file corpora. A row with no `sources` stands down anyway.
- id: rlm-context-loader
  name: rlm-context-loader
  disabled: true

# The row that makes `persistence: namespace` true rather than declared (D17).
# Mounted with the runtime, not optionally: the seam takes the provider's promise
# at registration, and these events are the promise being kept.
- id: rlm-kernel-snapshot
  name: rlm-kernel-snapshot
  config:
    inlineBlobMax: 65536
