[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ph-text-index"
version = "0.12.0"
description = "pH plugin: `text_index` and `text_search`, semantic retrieval over documents on a turbovec index."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Charles Tabor" }]
keywords = ["agent", "llm", "embeddings", "semantic-search", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# **This package is the seam and the tools, not the model that fills them.**
# `turbovec` is the index, and `numpy` is the form of a vector at the boundary,
# so both are what this package *is*. `sentence-transformers` is one provider
# for one row, and it brings torch, measured at 4.2 GB with the CUDA wheels. A
# dependency that large is a decision, and a decision belongs to whoever
# installs the package.
#
# The base install therefore gives you `text_index` and `text_search` over an
# index that you supply vectors for, and `[local]` adds the row that computes
# them. The cost is real and new, so it is stated plainly: **`pip install
# ph-text-index` no longer gives you a working index without more setup.**
# Without the extra, `text-index-local` refuses to mount, with a message that
# names the extra. No tool is registered then, because the claim of an embedder
# is what registers the manual (`ph_text_index.row`). A deployment with an
# embeddings *endpoint* (the `/v1/embeddings` of llama.cpp, or the API of a
# provider) mounts `text-index-endpoint` and never wanted torch.
#
# The split between seam and provider makes this change cheap, and not a
# rewrite. Only `text-index-local` imports the model. `_embed.py` imports
# `sentence_transformers` inside `_load()` and not at module scope. The suite
# runs the real turbovec index against a deterministic stub. None of those
# three was built for this change. They are the reason that it is one line.
dependencies = [
    "ph-core==0.12.0",
    "ph-utcp==0.12.0",
    "turbovec>=1.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
# The local embedder: what `text-index-local` needs to mount.
#
# **`torch` is named directly, although `sentence-transformers` already requires
# it.** A `[tool.uv.sources]` entry redirects only a dependency that the
# *declaring* project names, and torch would otherwise reach this package
# transitively. Without this line, the CPU-index pin below is silently ignored
# and the CUDA wheels come back. torch must be named in the same table as the
# package that brings it in. That is why it moved into the extra and did not
# stay above.
local = ["sentence-transformers>=3.0", "torch>=2.2"]

# What a model with an `auto_map` needs in addition to the local embedder.
# `einops` is pure Python and small. It is its own extra because only the remote
# code of some models imports it. The failure without it also proves that
# pre-provisioning must *load* the model and not only fetch it: nomic downloads
# its weights and its code successfully, then raises
# `ImportError: ... not found in your environment: einops` at load.
#
# The extra includes `[local]` and does not stand beside it. `einops` without
# the model whose remote code needs it is a set of packages that cannot embed
# anything, and `ph-text-index[nomic]` should mean what its name suggests.
nomic = ["ph-text-index[local]", "einops>=0.7"]

[project.urls]
Homepage = "https://github.com/chastabor/pH"
Repository = "https://github.com/chastabor/pH"
Documentation = "https://github.com/chastabor/pH/blob/main/docs/README.md"
Issues = "https://github.com/chastabor/pH/issues"

# The command is for trying a query by hand, and it is what the UTCP manual of
# the package calls.
[project.scripts]
ph-text-index = "ph_text_index.cli:main"

[project.entry-points."ph.bundles"]
text-index = "ph_text_index:BUNDLE"

# Three pairs. The first row of each pair is what a session mounts: it registers
# the manual of the package with `ph-utcp`. The `-engine` row of each pair is
# what the `ph-text-index` command mounts: the tools, and the model that fills
# them.
[project.entry-points."ph.plugins"]
text-index = "ph_text_index.row:apply"
text-index-local = "ph_text_index.row:local"
text-index-engine = "ph_text_index.engine:apply"
text-index-local-engine = "ph_text_index.engine:local"
text-index-endpoint = "ph_text_index.row:endpoint"
text-index-endpoint-engine = "ph_text_index.engine:endpoint"

[tool.uv.sources]
ph-core = { workspace = true }
ph-utcp = { workspace = true }
# The embedding model runs on the CPU: `SentenceTransformer` picks its device at
# load, and this package offers no GPU path. The default wheels of torch bundle
# CUDA all the same. Measured: 2.6 GB of `nvidia-*` and 398 MB of `triton`
# beside a 770 MB torch, in a 4.2 GB environment. Every one of those bytes was
# downloaded, stored, and never executed.
#
# The index itself is declared in the workspace root with `explicit = true`, so
# it serves only the names that ask for it directly. An index that answered for
# every name would shadow PyPI for any name that it happened to carry.
#
# A deployment that wants GPU embedding drops this line and re-locks. The line
# applies only to an install that asked for `[local]`. Without the extra, the
# resolution contains no torch for the line to redirect.
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/ph_text_index"]
