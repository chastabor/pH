# ph-text-index: `text_index` and `text_search`, over `ph-base`.
#
# This is a bundle and not rows that a profile writes by hand, for the reason
# that the bundle of `ph-code-graph` gives. `available_profiles()` gates a
# profile on whether its *bundles* resolve. A profile that layers this bundle is
# therefore hidden on an install without this distribution. It is not offered
# and then left to fail at mount.
#
# **The bundle has both rows, and both are enabled.** The claim of an embedder
# registers the manual of the package (see `ph_text_index.row`). A bundle with
# only `text-index` would therefore mount a service and advertise nothing. The
# failure would be silence, not an error. A deployment that wants another
# embedder disables `text-index-local` and mounts the row of that embedder. That
# is one line, and it is the case that the split between seam and provider
# exists for.
#
# Both rows wait on `ctx.utcp`: the tools run in the `ph-text-index` command,
# and `ph-utcp` is the row that runs it. A profile layers the `utcp` bundle
# first.

- id: text-index
  name: text-index

# The `sentence-transformers` provider. Its model loads in the command and not
# at mount. With `index.on_mount` at its default, a run starts before the first
# step of a root agent, so layering this bundle costs one indexing run for each
# session.
- id: text-index-local
  name: text-index-local
