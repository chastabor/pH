# ph-text-index: `text_index` and `text_search`, over `ph-base`.
#
# A bundle rather than rows a profile spells by hand, for the reason
# `ph-code-graph`'s says: `available_profiles()` gates a profile on whether its
# *bundles* resolve, so a profile layering this one is hidden on an install
# without this distribution instead of being offered and then failing at mount.
#
# **Both rows, and both enabled.** The package's manual is registered by an
# embedder's claim (see `ph_text_index.row`), so a bundle that shipped only
# `text-index` would mount a service and advertise nothing — the failure would
# be a silence, not an error. A deployment that wants another embedder disables
# `text-index-local` and mounts that embedder's row; that is one line, and it is
# the case the seam/provider split exists for.
#
# Both wait on `ctx.utcp`: the tools run in the `ph-text-index` command, and
# `ph-utcp` is the row that runs it. A profile layers the `utcp` bundle first.

- id: text-index
  name: text-index

# The `sentence-transformers` provider. Its model loads in the command, on first
# use and not at mount, so layering this bundle costs nothing until something
# indexes.
- id: text-index-local
  name: text-index-local
