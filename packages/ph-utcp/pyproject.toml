[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ph-utcp"
version = "0.10.0"
description = "pH plugin: tools published as UTCP manuals, as tools a pH agent can call."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Charles Tabor" }]
keywords = ["agent", "llm", "tools", "utcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# `utcp` is the client and its data model; `utcp-cli` is the one protocol this
# row runs through pH's own doors (`_library.PhCliProtocol`). The floors are the
# versions that were read: 1.1.5 is the CLI protocol whose arguments reach the
# shell as environment variables rather than as text spliced into the script,
# and the subclass here overrides two of its methods by name.
#
# **Ceilinged, because those two methods are private.** A release that renames
# either would leave the override dead and every command unconfined; the row
# refuses to mount then, and refuses an answer whose command did not pass through
# pH (`_library.require_ran`), but a minor version is the point to read the
# library again rather than find out from that refusal.
#
# No other protocol plugin is a dependency. A deployment that wants `http` or
# `mcp` manuals installs that plugin and names the type in the row's
# `protocols` — two steps on purpose, because those run inside the harness
# process and outside the sandbox.
dependencies = ["ph-core==0.10.0", "utcp>=1.2,<1.3", "utcp-cli>=1.1.5,<1.2"]

[project.urls]
Homepage = "https://github.com/chastabor/pH"
Repository = "https://github.com/chastabor/pH"
Documentation = "https://github.com/chastabor/pH/blob/main/docs/README.md"
Issues = "https://github.com/chastabor/pH/issues"

[project.entry-points."ph.bundles"]
utcp = "ph_utcp:BUNDLE"

[project.entry-points."ph.plugins"]
utcp = "ph_utcp:apply"

[tool.uv.sources]
ph-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ph_utcp"]
