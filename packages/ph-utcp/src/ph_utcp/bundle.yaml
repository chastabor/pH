# ph-utcp: the `utcp` row, over `ph-base`.
#
# This file is a bundle for the same reason that the bundle of `ph-code-graph`
# gives. Whether a profile can be composed depends on whether its *bundles*
# resolve. On an install without this distribution, a profile that layers this
# bundle is therefore hidden. It is not offered and then refused at mount.
#
# The bundle has one row, and the row lists no manuals. A manual is deployment
# configuration: which providers, and which paths they may write. A profile
# therefore adds manuals to the `manuals` of this row. A package that publishes
# its own manual (`ph-code-graph`, `ph-text-index`) adds it from its own row
# through `ctx.utcp.add`. When the row is mounted with nothing to discover, its
# only cost is one idle client.

- id: utcp
  name: utcp
