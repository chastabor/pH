# ph-code-graph: `code_index` and `code_graph`, over `ph-base`.
#
# This is a bundle and not a row that a profile writes by hand. The reason is
# `available_profiles()`. Whether a profile can be composed depends on whether
# its *bundles* resolve. A profile that layers this bundle is therefore correctly
# hidden on an install without this distribution, and the refusal names the
# package to install. A row that is named directly in a profile document gets no
# such check. The profile would be offered and would then fail at mount.
# `ph_app.profiles` says that two predicates for one question always produce
# exactly that result.
#
# The bundle has one row. `ph-code-graph` exists to register two tools. They
# arrive together, because `code_graph` without `code_index` is a query over an
# index that nothing built.

# The row is enabled, unlike `tool-todo` and `rlm-context-loader` in their
# bundles. Those rows are off because a profile that layers their bundle for
# something *else* (offload, compaction) must not also give the model a tool.
# This bundle holds nothing else, so layering it has exactly one meaning. A row
# that stood down would make `--profile rlm-indexed` do nothing.
- id: code-graph
  name: code-graph
