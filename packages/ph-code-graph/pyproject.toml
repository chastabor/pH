[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ph-code-graph"
version = "0.12.0"
description = "pH plugin: `code_index` and `code_graph`, a Python-native tree-sitter code graph with line-accurate answers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Charles Tabor" }]
keywords = ["agent", "llm", "tree-sitter", "code-search", "code-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Both are hard dependencies, and both are small. `tree-sitter` is the binding.
# `tree-sitter-language-pack` is a 3.7 MB wheel. Its 371 grammars are fetched
# from GitHub into a cache, each the first time it is used, or all by
# `ph-code-graph install`. (Measured: the 26 that the pack calls bundled are
# fetched too.) No Rust toolchain, no Node, and no submodule are needed: the
# graph itself is stdlib `sqlite3`.
#
# `ph-utcp` is a dependency because the row that a session mounts registers the
# manual of this package with it, and does not register the tools itself. The
# tools run in `ph-code-graph`.
dependencies = [
    "ph-core==0.12.0",
    "ph-utcp==0.12.0",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.16",
]

[project.urls]
Homepage = "https://github.com/chastabor/pH"
Repository = "https://github.com/chastabor/pH"
Documentation = "https://github.com/chastabor/pH/blob/main/docs/README.md"
Issues = "https://github.com/chastabor/pH/issues"

# The command is for trying a query by hand, and it is what the UTCP manual of
# the package calls. `python -m ph_code_graph` is the same command, and the
# manual uses that form.
[project.scripts]
ph-code-graph = "ph_code_graph.cli:main"

[project.entry-points."ph.bundles"]
code-graph = "ph_code_graph:BUNDLE"

[project.entry-points."ph.plugins"]
# What a session mounts: it registers the manual below with `ph-utcp`.
code-graph = "ph_code_graph.row:apply"
# What the `ph-code-graph` command mounts: the tools themselves.
code-graph-engine = "ph_code_graph.engine:apply"

[tool.uv.sources]
ph-core = { workspace = true }
ph-utcp = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ph_code_graph"]
