# ph-base: the shared core of every pH profile.
#
# Row order carries no load semantics — activation is service-availability
# driven, so a row waits for whatever it injects regardless of where it sits.
# The grouping below is for readers.
#
# A later bundle or the user's profile addresses these rows by id. A patch
# replaces the targeted row's WHOLE config rather than merging into it, so a
# row's effective value is always one layer's and readable in one place.

# --- the log, the vocabulary, the loop -------------------------------------
- id: llm
  name: llm

- id: session
  name: session

- id: system-prompt
  name: system-prompt

- id: agent
  name: agent

- id: agent-loop
  name: agent-loop
  config:
    maxParallelToolCalls: 10

# --- tools -----------------------------------------------------------------
- id: tools
  name: tools
  config:
    mode: native

- id: tools-prompt
  name: tools-prompt

# The row that makes `ToolDefinition.timeout_ms` true. Its own row, as in dsh,
# so a deployment wanting a different timeout policy swaps it.
- id: tools-timeout
  name: tools-timeout

# What `ph doctor` says about this deployment (P4-12). `ctx.tui_status` minus
# the `Session`: a row hands the report a reading, so the one command whose job
# is to be complete does not have to import three packages to be it. A
# contributor offers its section through `diagnostics.contribute`, which waits
# on the key rather than reading it at `apply` — so this row keeps the promise
# at the top of this file and may sit anywhere, above or below the rows it
# collects from.
- id: diagnostics
  name: diagnostics

# What the mount *became* — which rows activated, what each waits on, which
# layer disabled one, which realms exist — as against `--dump-config`, which is
# the composition before anything runs. dsh's rule: once structure comes from
# configuration, the static code no longer says what is running.
- id: topology
  name: topology

# --- capability seams ------------------------------------------------------
# Definition + one local provider each. A deployment swaps a provider by
# addressing the row; consumers never learn which one answered (I5).
- id: subprocess
  name: subprocess-local

- id: sandbox
  name: sandbox-policy
  config:
    defaultMode: read-only

- id: shell
  name: shell-local

# Where an agent's writes land (D21, §4.8). Mounted with the shared provider,
# which returns the session cwd — today's behaviour, no checkout, no cost — so
# layering this changes nothing until a profile names a containment tier. The
# seam is here rather than in a profile because `acquire` must never fail, and a
# fallback a profile might not have layered is not a fallback.
- id: workspace
  name: workspace-shared

# Who acquires, and when (P4-08). Separate from the seam because the two answer
# different questions, and because a deployment driving the lifecycle itself
# wants the seam without this. Under `workspace-shared` the root it hands an
# agent *is* the process's directory, so this changes nothing until a profile
# names a tier.
- id: workspace-lifecycle
  name: workspace-lifecycle

# The crash half of the same pair (F6). `ctx.effect` unwinds a workspace when
# the process exits cleanly; a process that dies does not unwind anything, and
# the only thing that can tell that leak from a tree the disposal policy *kept*
# on purpose is the log — both leave a worktree git reports identically. So an
# `acquired` with no `disposed` is reconciled the next time the session opens.
- id: workspace-reconcile
  name: workspace-reconcile

# Which rung of the ladder this deployment asked for (E1, E8, P4-11). **No rung
# by default** — which is not the same as `advisory`: mounting this must not opt
# a profile out of a tier provider it deliberately layered, so an unset `tier`
# means nobody chose and a provider that is present is used. A profile says
# `advisory` when it means "this agent stays in the person's own checkout".
- id: containment
  name: containment

- id: fs
  name: fs-local

- id: fs-read-before-edit
  name: fs-read-before-edit

- id: approval
  name: approval

- id: permission-presets
  name: permission-presets

- id: user-questions
  name: user-questions

- id: commands
  name: commands

- id: jobs
  name: jobs-local

- id: settings
  name: settings-local

- id: credentials
  name: credentials-env

- id: skills
  name: skills

# Progressive disclosure (G9): the catalog goes in the prompt, a body only when
# the model asks for it by name. `paths` is empty here deliberately — scanning a
# well-known directory at every start would make "install a skill" mean "drop a
# file somewhere", and a skill is something a distribution or a user installs
# on purpose (I7).
- id: skills-progressive
  name: skills-progressive

- id: spill
  name: spill-local

# Media the log points at but cannot rebuild. Beside the spill store and
# deliberately not part of it: a spilled result is a forwarding address, an
# attachment is content, and clearing a cache must never delete conversation.
- id: attachments
  name: attachments-local

# A provider's own copy of an attachment, and the handle to reference it by
# (P7-03). A cache under `$PH_CACHE`, not the log: a handle is a prediction with
# an expiry and the log cannot take one back, while the *upload* is a fact and is
# recorded. Mounted with no uploader — each adapter row registers its own — so a
# profile with no file API pays nothing and every route sends bytes inline.
- id: uploads
  name: uploads-local

- id: token-meter
  name: token-meter

# Delegation. The seam only: "run a child agent" has genuinely different
# answers in one deployment, so providers are named and a profile registers the
# one it wants (`rlm-child` in the rlm bundle).
- id: subagents
  name: subagents

# Work a root will do later (P5-06). The seam only: it records and folds, and
# the thing that *drives* ticks is whatever is running long enough to notice
# them — the daemon. A CLI run mounts this row and simply never fires anything,
# which is correct: a schedule created in a one-shot run is still in the log for
# the daemon to find.
- id: schedule
  name: schedule

# An autonomous run's objective, budget and quality gates (P5-07). The seam
# records and folds; `/autonomous` is the command that drives it — a command
# and not a host handler, so the governed pipeline sees every step (C2).
- id: goals
  name: goals

- id: autonomous
  name: autonomous

# Named kinds of child a deployment is willing to spawn (P4-13b) — a `reviewer`
# is `skills: [code-review]`, written once. **A menu, never a grant**: a parent
# selecting one still gets only what it holds itself, because a preset that
# widened whatever selected it would put an escalation one indirection away and
# under the model's control. Empty here; a profile names its own.
- id: subagent-presets
  name: subagent-presets

- id: code-runtime
  name: code-runtime

# Replacing history with a summary. The seam only, like the two above: *when* a
# conversation is too long and *what* a summary should say are policy, and a
# deployment that wants the plain harness should get a session that grows until
# the provider says no. `ph-stabilize` layers the engine (P4-03).
- id: compaction
  name: compaction

# The front end's own registration seam (P4-17). Here rather than in a TUI
# profile because a seam is a seam: a headless run that mounts a row
# registering a screen nothing draws needs no special case for it.
- id: tui-screens
  name: tui-screens

# The other half of the same idea: a row contributes one live *reading* to
# the footer rather than a whole screen. The context gauge is the shape being
# generalized — the number worth seeing is the one where the harness will act.
- id: tui-status
  name: tui-status

# --- model-facing tools ----------------------------------------------------
- id: tool-fs
  name: tool-fs

- id: tool-bash
  name: tool-bash

# Asking the person a question (P7-09). `disabled` here and enabled by `tui.yaml`
# — the `tool-todo` idiom — because a row that stops the work to wait for a human
# has no meaning in a posture with no human: headless, `ph -p`, a scheduled tick.
# Disabled rather than merely unanswerable, so an unattended run pays nothing for
# it at all: the model is never offered the tool, so no turn is spent calling it
# and no prompt tokens describe it. `--patch '{id: tool-ask-user, disabled: false}'`
# arms it anywhere.
- id: tool-ask-user
  name: tool-ask-user
  disabled: true

# The model door of I-9 (P7-01): a file the model found, read through `ctx.fs`
# so `permissions-fs` and the workspace tier bound it, and put in front of its
# own eyes as media. Enabled here rather than `disabled` like `tool-ask-user`,
# because it needs no human and no screen — and it registers nothing at all
# without an attachment store, so a profile that mounts none pays nothing.
- id: tool-attach
  name: tool-attach

# Delegation the model can await (P4-13). The seam has no provider in `ph-base`,
# and this row registers nothing until one is mounted — a tool advertised in
# every prompt and refused on every call teaches the model a capability the
# deployment does not have. A profile that layers `rlm-child` gets it.
- id: subagent-task
  name: subagent-task

# What the user told this agent to remember (G8): `AGENTS.md` from the agent's
# own root upward, then `$PH_HOME`. A **post-cache snapshot**, not a prompt
# section — the file exists to be edited, and an edit that moved the cached
# prefix would bill every earlier token again. The same placement is what makes
# an edit take effect in the turn after it, rather than after a restart.
- id: memory-agents-md
  name: memory-agents-md

# --- durability ------------------------------------------------------------
- id: session-persistence
  name: session-persistence-jsonl

- id: checkpoint-policy
  name: session-checkpoint-policy

- id: telemetry
  name: session-telemetry
  config:
    enabled: false

# --- resilience ------------------------------------------------------------
# Media the routed model cannot read, replaced with a pointer it can — above
# every adapter, because whether a route takes a MIME type is not a question
# about the wire. Does nothing until something attaches a file (P7-01).
- id: media-degrade
  name: media-degrade

- id: llm-retry
  name: llm-retry

# --- invariants ------------------------------------------------------------
# Checked at runtime, not only in tests: a harness that can only prove these in
# CI cannot prove them about your session. The registry is what makes the set
# *visible* — every one of these rows is optional, so "pH enforces I3" was only
# ever true of a profile, and `ph doctor` now says which.
- id: invariants
  name: invariants

- id: agent-loop-invariant
  name: agent-loop-invariant

- id: session-invariant
  name: session-invariant

- id: tools-invariant
  name: tools-invariant

- id: skills-invariant
  name: skills-invariant

- id: scope-invariant
  name: scope-invariant
