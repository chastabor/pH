# ph-base: the shared core of every pH profile.
#
# Row order carries no load semantics — activation is service-availability
# driven, so a row waits for whatever it injects regardless of where it sits.
# The grouping below is for readers.
#
# A later bundle or the user's profile addresses these rows by id. A patch
# replaces the targeted row's WHOLE config rather than merging into it, so a
# row's effective value is always one layer's and readable in one place.

# --- the log, the vocabulary, the loop -------------------------------------
- id: llm
  name: llm

- id: session
  name: session

- id: system-prompt
  name: system-prompt

- id: agent
  name: agent

- id: agent-loop
  name: agent-loop
  config:
    maxParallelToolCalls: 10

# --- tools -----------------------------------------------------------------
- id: tools
  name: tools
  config:
    mode: native

- id: tools-prompt
  name: tools-prompt

# The row that makes `ToolDefinition.timeout_ms` true. Its own row, as in dsh,
# so a deployment wanting a different timeout policy swaps it.
- id: tools-timeout
  name: tools-timeout

# --- capability seams ------------------------------------------------------
# Definition + one local provider each. A deployment swaps a provider by
# addressing the row; consumers never learn which one answered (I5).
- id: subprocess
  name: subprocess-local

- id: sandbox
  name: sandbox-policy
  config:
    defaultMode: read-only

- id: shell
  name: shell-local

- id: fs
  name: fs-local

- id: fs-read-before-edit
  name: fs-read-before-edit

- id: approval
  name: approval

- id: permission-presets
  name: permission-presets

- id: user-questions
  name: user-questions

- id: commands
  name: commands

- id: jobs
  name: jobs-local

- id: settings
  name: settings-local

- id: credentials
  name: credentials-env

- id: skills
  name: skills

- id: spill
  name: spill-local

# Media the log points at but cannot rebuild. Beside the spill store and
# deliberately not part of it: a spilled result is a forwarding address, an
# attachment is content, and clearing a cache must never delete conversation.
- id: attachments
  name: attachments-local

- id: token-meter
  name: token-meter

# Delegation. The seam only: "run a child agent" has genuinely different
# answers in one deployment, so providers are named and a profile registers the
# one it wants (`rlm-child` in the rlm bundle).
- id: subagents
  name: subagents

- id: code-runtime
  name: code-runtime

# Replacing history with a summary. The seam only, like the two above: *when* a
# conversation is too long and *what* a summary should say are policy, and a
# deployment that wants the plain harness should get a session that grows until
# the provider says no. `ph-stabilize` layers the engine (P4-03).
- id: compaction
  name: compaction

# The front end's own registration seam (P4-17). Here rather than in a TUI
# profile because a seam is a seam: a headless run that mounts a row
# registering a screen nothing draws needs no special case for it.
- id: tui-screens
  name: tui-screens

# --- model-facing tools ----------------------------------------------------
- id: tool-fs
  name: tool-fs

- id: tool-bash
  name: tool-bash

- id: agent-instructions
  name: agent-instructions

# --- durability ------------------------------------------------------------
- id: session-persistence
  name: session-persistence-jsonl

- id: checkpoint-policy
  name: session-checkpoint-policy

- id: telemetry
  name: session-telemetry
  config:
    enabled: false

# --- resilience ------------------------------------------------------------
# Media the routed model cannot read, replaced with a pointer it can — above
# every adapter, because whether a route takes a MIME type is not a question
# about the wire. Does nothing until something attaches a file (P7-01).
- id: media-degrade
  name: media-degrade

- id: llm-retry
  name: llm-retry

# --- invariants ------------------------------------------------------------
# "Model-visible means logged" is checked at runtime, not only in tests: a
# harness that can only prove this in CI cannot prove it about your session.
- id: agent-loop-invariant
  name: agent-loop-invariant
