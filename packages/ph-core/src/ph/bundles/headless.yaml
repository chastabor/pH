# ph-headless: base plus a scripted adapter, for one-shot and test runs.
#
# The routes and the replies of the fake adapter are the config of the row, so
# a scenario test scripts a conversation without a change to code.
- insert:
    - id: llm-fake
      name: llm-fake
      config:
        providers: [fake]
        replies: []

# The one route of the scripted adapter, as the default that a root runs on.
- id: models
  config:
    default: main
    models:
      main: {provider: fake, model: fake-1}
