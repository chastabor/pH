name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The path tiers (Q1) and the process lifecycle (§4.9) are exactly where
        # a Linux-only harness quietly stops being correct, which is why P0-01
        # set up a three-OS matrix before there was any code to run in it — its
        # gate was "CI green on an empty package set on all three OSes".
        #
        # `windows-latest` is out until **P6-11** ("Windows in CI for every
        # lifecycle and path test"; gate: *matrix green*) lands, and this is the
        # honest bookkeeping rather than a retreat: the daemon reaches for
        # `anyio.create_unix_listener` and `connect_unix` unconditionally in
        # three places, so ~70 tests cannot pass there, and `paths.py`'s "on
        # Windows the same path names a named pipe" is an aspiration with no
        # implementation behind it. Ten tests in the suite opt out of POSIX;
        # the rest have simply never run on Windows.
        #
        # Leaving it in the matrix made every push mail out a failure nobody
        # was going to act on, which costs more than it buys: a signal that is
        # always red stops being read, and the two rows that would have to go
        # green — this one and P6-11 — became indistinguishable. Putting
        # Windows back *is* P6-11's job, and its gate now means something
        # concrete: add this entry and make it pass.
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # **`jj` is a Rust binary, so nothing the workspace installs can supply
      # it.** There is no PyPI distribution that is Jujutsu — a lookalike name
      # would be somebody else's package — and `cargo install jj-cli` compiles
      # from source for minutes. The published release tarball is 11 MB and
      # holds a static-pie binary with no runtime dependencies, so it is the
      # cheapest of the three by a wide margin.
      #
      # **Without it 56 tests skip rather than run**, and the skip is not free:
      # the `needs_jj` tier is `ph.seams.workspace_jj` and the text index's
      # change detection, none of which has ever executed on any machine but a
      # developer's. It also costs about 2.2 points of `ph-core` coverage, which
      # is what put the `fail_under = 93` gate out of reach here — the ratchet's
      # own history records 91.21 %, and that is exactly this suite's number
      # with jj absent.
      #
      # Pinned rather than latest: a jj release that changed behaviour should
      # break on a commit that bumps this line, not on whichever unrelated push
      # happened to land first. The tests configure `user.name`/`user.email`
      # per repo themselves, so nothing else is needed here.
      #
      # The archive stores its members as `./jj`, so `tar … jj` does not match
      # one — extract the whole thing rather than selecting.
      - name: Install jj
        shell: bash
        run: |
          set -euo pipefail
          version=0.45.1
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   target=x86_64-unknown-linux-musl ;;
            Linux-ARM64) target=aarch64-unknown-linux-musl ;;
            macOS-ARM64) target=aarch64-apple-darwin ;;
            macOS-X64)   target=x86_64-apple-darwin ;;
            *) echo "no published jj build for ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/jj"
          curl -fsSL --retry 3 \
            "https://github.com/jj-vcs/jj/releases/download/v${version}/jj-v${version}-${target}.tar.gz" \
            | tar -xz -C "$HOME/.local/jj"
          echo "$HOME/.local/jj" >> "$GITHUB_PATH"
          # `GITHUB_PATH` reaches the *next* step, so this one checks by path.
          "$HOME/.local/jj/jj" --version

      - name: Sync the workspace
        run: uv sync --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # Not one package: `[tool.mypy] files` in the root manifest names all seven
      # plus every test tree — 438 source files — because `ph_rlm` and
      # `ph_runtime` are where the subprocess protocol lives, and a gate that
      # checked only `ph` would have let the guest half drift untyped.
      - name: Type-check the workspace
        run: uv run mypy

      - name: Test
        run: uv run pytest -q --cov=ph --cov-report=term
