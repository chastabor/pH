name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The path tiers (Q1) and the process lifecycle (§4.9) are exactly where
        # a Linux-only harness quietly stops being correct, which is why P0-01
        # set up a three-OS matrix before there was any code to run in it — its
        # gate was "CI green on an empty package set on all three OSes".
        #
        # `windows-latest` is out until **P6-11** ("Windows in CI for every
        # lifecycle and path test"; gate: *matrix green*) lands, and this is the
        # honest bookkeeping rather than a retreat: the daemon reaches for
        # `anyio.create_unix_listener` and `connect_unix` unconditionally in
        # three places, so ~70 tests cannot pass there, and `paths.py`'s "on
        # Windows the same path names a named pipe" is an aspiration with no
        # implementation behind it. Ten tests in the suite opt out of POSIX;
        # the rest have simply never run on Windows.
        #
        # Leaving it in the matrix made every push mail out a failure nobody
        # was going to act on, which costs more than it buys: a signal that is
        # always red stops being read, and the two rows that would have to go
        # green — this one and P6-11 — became indistinguishable. Putting
        # Windows back *is* P6-11's job, and its gate now means something
        # concrete: add this entry and make it pass.
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the workspace
        run: uv sync --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check ph-core
        run: uv run mypy

      - name: Test
        run: uv run pytest -q
